# Alembic configuration (contracts/cli.md, research D-03).
# There is deliberately no database URL here: migrations/env.py reads DATABASE_URL through
# hcm_lite.config.get_settings(). Run from the repository root: `alembic upgrade head`.

[alembic]
script_location = %(here)s/hcm_lite/db/migrations
prepend_sys_path = .
path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
