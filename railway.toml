# Railway config for HCM Lite — https://docs.railway.com/reference/config-as-code
# Build is auto-detected (Nixpacks reads requirements.txt + .python-version).
# Create a Volume in the Railway dashboard and mount it at /data (see RAILWAY.md),
# so the SQLite database and Qdrant index persist across restarts and redeploys.

[build]
builder = "nixpacks"

[deploy]
# Run migrations (idempotent) on every boot, then start the UI + API on Railway's $PORT.
startCommand = "alembic upgrade head && uvicorn hcm_lite.api.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
