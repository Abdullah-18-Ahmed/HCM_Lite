# Render Blueprint for HCM Lite — FREE tier, simplest setup (for a demo/showcase).
# https://render.com/docs/blueprint-spec
# Deploy: push this repo, then on Render: New + -> Blueprint -> pick this repo -> Apply.
# The only secret you provide is OPENAI_API_KEY. See DEPLOY.md.

services:
  - type: web
    name: hcm-lite
    runtime: python
    plan: free               # free web service: sleeps after ~15 min idle (fine for a demo)
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    # Create the schema on every boot (idempotent), then start the UI + API.
    startCommand: alembic upgrade head && uvicorn hcm_lite.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # --- The only secret you set by hand (in the Render dashboard) ---
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-4o-mini"              # change to the model you use
      - key: OPENAI_EMBEDDING_MODEL
        value: "text-embedding-3-small"
      # --- API auth secret: Render generates a strong value automatically ---
      - key: API_JWT_SECRET
        generateValue: true
      - key: API_TOKEN_MINUTES
        value: "60"
      - key: SESSION_IDLE_MINUTES
        value: "60"
      - key: APP_TIMEZONE
        value: "UTC"
# Data lives on the container's temporary disk (local SQLite + embedded Qdrant), so it RESETS
# when the free service cold-starts (after ~15 min idle, or on each redeploy). For a live demo
# that's fine: just create the admin account when you open the site. If your teacher will open
# the link on their own later and you want the data to still be there, see DEPLOY.md for the
# free persistent option (Neon Postgres + Qdrant Cloud).
