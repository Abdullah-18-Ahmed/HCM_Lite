# Render Blueprint for HCM Lite — FREE + persistent (Neon Postgres + Qdrant Cloud).
# https://render.com/docs/blueprint-spec
# Deploy: push this repo, then on Render: New + -> Blueprint -> pick this repo -> Apply.
# You MUST create the two free databases first and paste their values when prompted —
# see DEPLOY.md for the click-by-click guide.

services:
  - type: web
    name: hcm-lite
    runtime: python
    plan: free               # free web service: sleeps when idle, but data lives in the
                             # external Postgres + Qdrant below, so nothing resets.
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    # Run migrations on every boot (idempotent) against Postgres, then start the UI + API.
    startCommand: alembic upgrade head && uvicorn hcm_lite.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"

      # --- OpenAI (set OPENAI_API_KEY by hand in the Render dashboard) ---
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-4o-mini"              # change to the model you use
      - key: OPENAI_EMBEDDING_MODEL
        value: "text-embedding-3-small"

      # --- API auth secret: Render generates a strong value automatically ---
      - key: API_JWT_SECRET
        generateValue: true
      - key: API_TOKEN_MINUTES
        value: "60"
      - key: SESSION_IDLE_MINUTES
        value: "60"
      - key: APP_TIMEZONE
        value: "UTC"

      # --- Postgres (Neon / Supabase) — paste the async URL in the dashboard ---
      #     Format: postgresql+asyncpg://USER:PASSWORD@HOST/DBNAME
      - key: DATABASE_URL
        sync: false

      # --- Qdrant Cloud — paste cluster URL + API key in the dashboard ---
      - key: VECTOR_STORE_PROVIDER
        value: "qdrant"
      - key: VECTOR_STORE_URL
        sync: false
      - key: VECTOR_STORE_API_KEY
        sync: false
      - key: VECTOR_STORE_COLLECTION
        value: "hr_documents"
# With external Postgres + Qdrant, the web service is stateless: data survives sleeps and
# redeploys. The free plan still sleeps after ~15 min idle (first wake ~30-60s), but your
# admin account, records and RAG index all persist.
